name: CryptoTerminal Pro - Signal Engine

on:
  schedule:
    # ہر 5 منٹ بعد چلے (UTC وقت کے مطابق)
    - cron: "*/5 * * * *"
  workflow_dispatch:  # مینوئل طور پر GitHub پر بٹن دبا کر بھی چلا سکتے ہیں

jobs:
  run-signal-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Repo کو checkout کریں
        uses: actions/checkout@v4

      - name: Python سیٹ اپ کریں
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies انسٹال کریں
        run: pip install -r 3_requirements.txt

      - name: سگنل انجن چلائیں
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python 2_signal_engine.py
